
server:
  port: ${PORT:8080}

spring:
  application:
    name: exam-seating-engine

  # Spring Boot 4 uses Jackson 3. Jackson 3 implicitly treats constructors with
  # parameter names (Lombok's @AllArgsConstructor) as property-based creators,
  # which nulls collection fields such as ExamRoom.benches on request bodies and
  # changes several serialization defaults. Keep the Jackson 2 defaults so the
  # existing JSON contract for the legacy frontend is preserved. Remove this
  # bridge after a full Jackson 3 audit of the API payloads.
  jackson:
    use-jackson2-defaults: true


  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"


  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/examseating?createDatabaseIfNotExist=true&sslMode=DISABLED&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

 
  jpa:
    # use 'validate' + Flyway/Liquibase for production.
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Hibernate 7 resolves the dialect from the JDBC connection metadata;
        # an explicit org.hibernate.dialect.MySQLDialect is no longer required.
        format_sql: true
    # open-in-view=false: the classic Spring trap — with it ON (default), Hibernate keeps
    # the Session open until the HTTP response is written, hiding lazy-loading bugs.
    # OFF makes "lazy access outside a transaction" fail loudly, which is what we want.
    open-in-view: false
    show-sql: ${SHOW_SQL:false}


  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}

# ---------------- App-specific ----------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  
  seed-demo: ${SEED_DEMO:false}
  # "open" (default) = no authentication, for demos/testing.
  # "enforced" = HTTP Basic + role checks (ADMIN / EXAM_CELL / INVIGILATOR).
  security:
    mode: ${SECURITY_MODE:open}
  # Demo accounts (admin/examcell/invigilator) are NEVER created 
  # Seeded passwords are for local demos only.
  seed-users: ${SEED_USERS:false}

  # ---------------- Multi-tenancy / subscriptions ----------------
  # One institution per customer. Legacy rows with a NULL institution_id belong
  # to this default institution, so existing databases keep working unchanged.
  tenancy:
    default-slug: ${DEFAULT_INSTITUTION_SLUG:default}
  auth:
    token-ttl-hours: ${TOKEN_TTL_HOURS:24}
    # How long a session lasts when the person ticked "keep me signed in".
    remember-ttl-days: ${REMEMBER_TTL_DAYS:30}
  storage:
    dir: ${STORAGE_DIR:./data/storage}

logging:
  level:
    root: INFO
    com.examseating: INFO
    # Turn on to watch Spring Security's filter decisions:
    # org.springframework.security: DEBUG
