spring:
  # Same Jackson 2 compatibility bridge as the main configuration: test
  # resources shadow src/main/resources/application.yml on the classpath.
  jackson:
    use-jackson2-defaults: true
  datasource:
    # H2 in-memory database: the test suite needs no MySQL server.
    # MODE=MySQL keeps MySQL-flavoured SQL working; DB_CLOSE_DELAY=-1 keeps the
    # in-memory database alive for the whole JVM (one context for all tests).
    url: jdbc:h2:mem:examseating;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # A fresh schema for every run; nothing is carried over between builds.
      ddl-auto: create-drop
    # Hibernate 7 auto-detects H2Dialect from the JDBC metadata; no explicit
    # hibernate.dialect property is needed (it produced HHH90000025).
    open-in-view: false
    show-sql: false
