openapi: 3.0.3
info:
  title: Exam Seating Builder API
  version: '1.0'
  description: |
    Resource-oriented REST API for exam halls, student rosters, seating plans and
    downloadable outputs. All collection responses share the `PageResponse`
    envelope; all failures share the `ErrorResponse` envelope.

    Authentication is optional in the demo build (`SECURITY_MODE=open`). With
    `SECURITY_MODE=enforced`, every endpoint requires HTTP Basic and write
    operations require `ADMIN` or `EXAM_CELL`.

    The `/api/...` paths are **deprecated aliases** kept for the bundled SPA;
    new integrations should use `/api/v1/...`.

    Multi-tenancy: every operational row belongs to an institution. A bearer
    token (from `/api/v1/auth/login`) selects the tenant; in demo mode an
    `X-Institution-Id` header or the seeded default institution is used.
    Plan limits (students, halls, generations, storage) are enforced with
    HTTP 429 `QUOTA_EXCEEDED` errors.
  license:
    name: Project documentation
servers:
  - url: /
    description: Same host as the bundled UI

tags:
  - name: Students
  - name: Student identification
  - name: Rooms
  - name: Seating plans
  - name: Seating rounds
  - name: Exports
  - name: Legacy aliases
  - name: Accounts
  - name: Plans & usage
  - name: Files

paths:
  # ---------------------------------------------------------------- students
  /api/v1/students:
    get:
      tags: [Students]
      summary: List students (paged, filterable, sortable)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: subjectCode
          in: query
          schema: { type: string }
        - name: department
          in: query
          schema: { type: string }
        - name: sortBy
          in: query
          schema: { type: string, enum: [id, name, rollNo, department, yearSession, subjectCode], default: id }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: A page of students
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Student' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Students]
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentInput' }
      responses:
        '201':
          description: Created; `Location` points at the new resource
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/students/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Students]
      summary: Get one student
      responses:
        '200':
          description: The student
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Students]
      summary: Replace a student
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentInput' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Students]
      summary: Partially update a student
      description: Only name, rollNo, department, course, yearSession and subjectCode may be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example: { department: "Physics", yearSession: "2026" }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Students]
      summary: Delete a student
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/students/imports:
    post:
      tags: [Students]
      summary: Import a student roster from Excel
      description: |
        Any column layout is accepted: the sheet does not have to contain a
        roll number, and columns the system does not know are kept as named
        attributes.

        How the students in the file are identified is decided in this order:
        the `identityAttributes` parameter of this request, then the
        institution's identity scheme (`/api/v1/students/identity`), then the
        file itself (a column that is known to carry an identifier, else a
        column that is unique across the file, else a combination of columns).

        Call `POST /api/v1/students/imports/preview` first to see which
        columns the file has and which of them could identify a student.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                identityAttributes:
                  type: string
                  description: |
                    The attribute(s) that identify a student, separated by
                    commas. A single attribute (`registrationnumber`) or a
                    combination (`rollno,batchnumber`). May also be the
                    header exactly as it appears in the file.
                  example: rollno,batchnumber
      responses:
        '200':
          description: Per-row import result; bad rows are reported, not fatal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /api/v1/students/imports/preview:
    post:
      tags: [Student identification]
      summary: Analyse a roster file without importing it
      description: |
        Reads a roster and reports what it found: every column of the sheet
        (with the values it holds), which columns could identify a student,
        and which single attributes or combinations of attributes would
        identify every student uniquely.

        This is what a client shows the institution before the import:
        "your sheet has Application Id, Batch and Department — which one
        identifies a student?"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: What the file contains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /api/v1/students/identity:
    get:
      tags: [Student identification]
      summary: The institution's student-identification rule
      description: |
        Reports which attributes identify a student for this institution, and
        how students are labelled in the plan and in the exports. An empty
        `attributes` list means the institution relies on auto-detection.
      responses:
        '200':
          description: The identity scheme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityScheme' }
    put:
      tags: [Student identification]
      summary: Declare which attributes identify a student
      description: |
        One attribute or a combination of attributes. The attributes are the
        column names of the uploaded roster, normalized to lower-case
        alphanumerics — `registrationnumber`, `rollno`, `batchnumber`.

        Replaces the previous rule. Students who were imported before keep
        their identity; the rule applies to later imports and to students
        added by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentitySchemeRequest' }
            example: { label: "Roll no + batch", attributes: [rollno, batchnumber] }
      responses:
        '200':
          description: The stored rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityScheme' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Student identification]
      summary: Back to auto-detection
      responses:
        '204': { description: The rule was removed }

  # ------------------------------------------------------------------- rooms
  /api/v1/rooms:
    get:
      tags: [Rooms]
      summary: List exam halls (paged, filterable, sortable)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - name: hallName
          in: query
          schema: { type: string }
        - name: benchType
          in: query
          schema: { $ref: '#/components/schemas/BenchType' }
        - name: sortBy
          in: query
          schema: { type: string, enum: [id, hallName, rows, columns], default: hallName }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: A page of halls
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ExamRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Rooms]
      summary: Create a hall (bench grid is generated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamRoomInput' }
      responses:
        '201':
          description: Created; `Location` points at the new resource
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Rooms]
      summary: Get one hall with its bench grid
      responses:
        '200':
          description: The hall
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamRoom' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Rooms]
      summary: Replace a hall (saved seats in this hall are cleared)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamRoomInput' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Rooms]
      summary: Partially update a hall
      description: Changing rows, columns or benchType clears this hall's saved seats and rebuilds the bench grid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example: { columns: 8 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamRoom' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Rooms]
      summary: Delete a hall (and its saved seats)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/rooms/{id}/benches:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Rooms]
      summary: List a hall's benches (paged, row-major)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: A page of benches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Bench' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/rooms/imports:
    post:
      tags: [Rooms]
      summary: Import halls from Excel
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Per-row import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  # ----------------------------------------------------------- seating plans
  /api/v1/seating-plans:
    get:
      tags: [Seating plans]
      summary: Read the current seating plan (paged allocations)
      parameters:
        - name: subjectCode
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: Plan summary with a page of allocations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Seating plans]
      summary: Generate and persist a seating round
      description: |
        `clearExisting=false` requires `subjectCode`. Seats held by other rounds
        are treated as occupied, so two papers never reuse the same seat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArrangeRequest' }
      responses:
        '201':
          description: Generated; `Location` points at the plan resource
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Seating plans]
      summary: Clear the plan (all rounds, or one subject)
      parameters:
        - name: subjectCode
          in: query
          schema: { type: string }
      responses:
        '204': { description: Cleared }

  /api/v1/seating-rounds:
    get:
      tags: [Seating rounds]
      summary: The seating rounds of this institution
      description: |
        Every round that was arranged, with the rules it was solved with:
        the gaps (dH/dV/dD), the conflict scope, the bench-mate rule, the
        group attributes and how many students were seated.
      responses:
        '200':
          description: The recorded rounds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SeatingRound' }

  /api/v1/seating-rounds/current:
    get:
      tags: [Seating rounds]
      summary: The round that produced the current plan
      description: |
        The rules the current plan was built under. A seat that is changed
        by hand afterwards is checked against exactly these rules.
      parameters:
        - name: subjectCode
          in: query
          schema: { type: string }
          description: The subject scope; omit it for the whole roster
      responses:
        '200':
          description: The current round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingRound' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/seating-plans/allocations:
    get:
      tags: [Seating plans]
      summary: List allocated seats (paged, filterable)
      parameters:
        - name: subjectCode
          in: query
          schema: { type: string }
        - name: hallName
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: A page of allocations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AllocationDto' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/seating-plans/allocations/{allocationId}:
    patch:
      tags: [Seating plans]
      summary: Move a seated student to another seat
      description: |
        Changes one seat of the current plan by hand. The new seat is checked
        against the anti-cheating rules of the round the seat belongs to: a move
        onto a seat that is already taken, or onto a seat the separation rules
        forbid, is refused with `409 CONFLICT` and nothing is changed.

        The seat is addressed by its position in the hall grid — `roomId` picks
        the hall, `benchRow`/`benchCol` the bench inside it and `slot` the seat
        on that bench (1 on a single-seater, 1 or 2 on a dual-seater).
      parameters:
        - name: allocationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveAllocationRequest' }
      responses:
        '200':
          description: The allocation as it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------------- exports
  /api/v1/exports:
    get:
      tags: [Exports]
      summary: Discover available export representations
      responses:
        '200':
          description: Representation name → path
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: string } }

  /api/v1/exports/excel:
    get:
      tags: [Exports]
      summary: Download the seating plan as .xlsx
      parameters:
        - name: subjectCode
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /api/v1/exports/pdf/door-notices:
    get:
      tags: [Exports]
      summary: Download printable door notices as .pdf
      parameters:
        - name: subjectCode
          in: query
          schema: { type: string }
      responses:
        '200':
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /api/v1/exports/pdf/invigilator:
    get:
      tags: [Exports]
      summary: Download invigilator attendance sheets as .pdf
      parameters:
        - name: subjectCode
          in: query
          schema: { type: string }
      responses:
        '200':
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }

  # --------------------------------------------------------- legacy aliases
  /api/students:
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use GET /api/v1/students
      responses:
        '200':
          description: Plain array (legacy shape preserved for the bundled SPA)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Student' }
    post:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use POST /api/v1/students
      responses:
        '201': { description: Created }

  /api/students/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use GET /api/v1/students/{id}
      responses:
        '200':
          description: The student
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use PUT /api/v1/students/{id}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentInput' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use DELETE /api/v1/students/{id}
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/students/import:
    post:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use POST /api/v1/students/imports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Per-row import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/rooms:
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use GET /api/v1/rooms
      responses:
        '200':
          description: Plain array (legacy shape preserved for the bundled SPA)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExamRoom' }
    post:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use POST /api/v1/rooms
      responses:
        '201': { description: Created }

  /api/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use GET /api/v1/rooms/{id}
      responses:
        '200':
          description: The hall
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamRoom' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use PUT /api/v1/rooms/{id}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExamRoom' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamRoom' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use DELETE /api/v1/rooms/{id}
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/rooms/import:
    post:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use POST /api/v1/rooms/imports
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Per-row import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/seating/arrange:
    post:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use POST /api/v1/seating-plans
      responses:
        '200':
          description: Plan summary (legacy status is 200, v1 returns 201)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingResponse' }
  /api/seating/allocations:
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use GET /api/v1/seating-plans
      responses:
        '200':
          description: Plan summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingResponse' }
    delete:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use DELETE /api/v1/seating-plans
      responses:
        '200': { description: Cleared (legacy shape; v1 returns 204) }
  /api/export/excel:
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use GET /api/v1/exports/excel
      responses:
        '200': { description: Excel workbook }
  /api/export/pdf/door-notices:
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use GET /api/v1/exports/pdf/door-notices
      responses:
        '200': { description: PDF document }
  /api/export/pdf/invigilator:
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — use GET /api/v1/exports/pdf/invigilator
      responses:
        '200': { description: PDF document }
  /api/mock/generate:
    post:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — demo data generator
      responses:
        '200': { description: Generated }
  /api/mock/clear:
    delete:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — demo data clear
      responses:
        '200': { description: Cleared }
  /api/mock/stats:
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — demo data statistics
      responses:
        '200': { description: Statistics }
  /api/auth/me:
    get:
      tags: [Legacy aliases]
      deprecated: true
      summary: Deprecated alias — current principal
      responses:
        '200': { description: Principal }

  # ---------------------------------------------------------------- accounts
  /api/v1/auth/register:
    post:
      tags: [Accounts]
      summary: Create an institution, its administrator and a FREE subscription
      operationId: registerInstitution
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Institution created
          headers:
            Location: { schema: { type: string }, description: /api/v1/institutions/current }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/login:
    post:
      tags: [Accounts]
      summary: Exchange credentials for an opaque bearer token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/me:
    get:
      tags: [Accounts]
      summary: Current session
      operationId: currentSession
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Accounts]
      summary: Revoke the current token
      operationId: logout
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/institutions/current:
    get:
      tags: [Accounts]
      summary: Institution resolved for this request
      operationId: currentInstitution
      responses:
        '200':
          description: Institution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionView' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      summary: Update institution name / contact email (ADMIN)
      operationId: updateInstitution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstitutionUpdate' }
      responses:
        '200':
          description: Updated institution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstitutionView' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/plans:
    get:
      tags: [Plans & usage]
      summary: Public plan catalogue
      operationId: listPlans
      security: []
      responses:
        '200':
          description: Plans ordered by tier
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanView' }

  /api/v1/subscriptions/current:
    get:
      tags: [Plans & usage]
      summary: Active plan and billing period
      operationId: currentSubscription
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionView' }
    put:
      tags: [Plans & usage]
      summary: Upgrade or downgrade (ADMIN)
      operationId: changePlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanChangeRequest' }
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }

  /api/v1/usage:
    get:
      tags: [Plans & usage]
      summary: All quota counters against the current plan
      operationId: usage
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageView' }

  /api/v1/generations:
    get:
      tags: [Plans & usage]
      summary: Recent generation-limit events
      operationId: generations
      responses:
        '200':
          description: Recent generations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GenerationView' }

  /api/v1/files:
    get:
      tags: [Files]
      summary: Files owned by the current institution
      operationId: listFiles
      responses:
        '200':
          description: Stored files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StoredFileView' }
    post:
      tags: [Files]
      summary: Upload one file, counted against the storage quota
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredFileView' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/QuotaExceeded' }

  /api/v1/files/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Files]
      summary: Download file bytes
      operationId: downloadFile
      responses:
        '200':
          description: Binary file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Files]
      summary: Delete file metadata and bytes (ADMIN / EXAM_CELL)
      operationId: deleteFile
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Required only when SECURITY_MODE=enforced
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque token from POST /api/v1/auth/login; also selects the institution

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: Invalid request / validation failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: |
        The change was refused — a unique constraint was violated, or the seat
        is taken, or the anti-cheating rules of the round forbid the placement.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: Seating engine rejected the input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Upload exceeds the configured limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, expired or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Role is not allowed to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    QuotaExceeded:
      description: A plan limit was reached (code QUOTA_EXCEEDED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    BenchType:
      type: string
      enum: [SINGLE_SEATER, DUAL_SEATER]

    Student:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 100 }
        rollNo: { type: string, nullable: true, maxLength: 30 }
        identityKey: { type: string, nullable: true, maxLength: 255 }
        attributes:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: The institution's own columns (batch number, section, house, ...)
        department: { type: string, nullable: true, maxLength: 60 }
        course: { type: string, nullable: true, maxLength: 60 }
        yearSession: { type: string, nullable: true, maxLength: 30 }
        subjectCode: { type: string, nullable: true, maxLength: 20 }

    StudentInput:
      type: object
      required: [name]
      description: |
        `rollNo` is optional — an institution may identify its students by a
        registration number, an admission number, a combination of two
        columns, or by nothing that looks like a number. The attributes the
        institution declared in `/api/v1/students/identity` decide which value
        identifies the student.
      properties:
        name: { type: string, maxLength: 100 }
        rollNo: { type: string, nullable: true, maxLength: 30 }
        attributes:
          type: object
          additionalProperties: { type: string }
          example: { applicationid: "APP-001", batch: "A" }
        department: { type: string, nullable: true, maxLength: 60 }
        course: { type: string, nullable: true, maxLength: 60 }
        yearSession: { type: string, nullable: true, maxLength: 30 }
        subjectCode: { type: string, nullable: true, maxLength: 20 }

    IdentityScheme:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        label: { type: string, nullable: true }
        attributes:
          type: array
          items: { type: string }
          description: The attributes that identify a student; empty means auto-detection
        displayAttribute: { type: string, nullable: true }

    IdentitySchemeRequest:
      type: object
      required: [attributes]
      properties:
        label: { type: string, nullable: true }
        attributes:
          type: array
          minItems: 1
          items: { type: string }
          description: One attribute, or a combination of several

    ImportPreview:
      type: object
      properties:
        totalRows: { type: integer }
        columns:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
              kind: { type: string, enum: [typed, attribute] }
              complete: { type: boolean }
              unique: { type: boolean }
              distinctValues: { type: integer }
              samples:
                type: array
                items: { type: string }
        suggestedIdentities:
          type: array
          items:
            type: object
            properties:
              attributes:
                type: array
                items: { type: string }
              label: { type: string }
              unique: { type: boolean }
        currentScheme:
          nullable: true
          allOf: { $ref: '#/components/schemas/IdentityScheme' }

    SeatingRound:
      type: object
      properties:
        subjectKey: { type: string, nullable: true }
        subjectCode: { type: string, nullable: true }
        horizontalGap: { type: integer }
        verticalGap: { type: integer }
        diagonalGap: { type: integer }
        conflictScope: { type: string, nullable: true }
        benchPairingRule: { type: string, nullable: true }
        horizontalDeptIsolation: { type: boolean }
        groupAttributes:
          type: array
          items: { type: string }
        groupMatchMode: { type: string, nullable: true, enum: [ALL, ANY] }
        seatedCount: { type: integer }
        createdAt: { type: string, format: date-time, nullable: true }

    Bench:
      type: object
      properties:
        id: { type: integer, format: int64 }
        rowIndex: { type: integer }
        colIndex: { type: integer }
        benchType: { $ref: '#/components/schemas/BenchType' }

    ExamRoom:
      type: object
      properties:
        id: { type: integer, format: int64 }
        hallName: { type: string, maxLength: 100 }
        rows: { type: integer, minimum: 1, maximum: 500 }
        columns: { type: integer, minimum: 1, maximum: 500 }
        benchType: { $ref: '#/components/schemas/BenchType' }
        benches:
          type: array
          items: { $ref: '#/components/schemas/Bench' }

    ExamRoomInput:
      type: object
      required: [hallName, rows, columns, benchType]
      properties:
        hallName: { type: string, maxLength: 100 }
        rows: { type: integer, minimum: 1, maximum: 500 }
        columns: { type: integer, minimum: 1, maximum: 500 }
        benchType: { $ref: '#/components/schemas/BenchType' }

    ImportResult:
      type: object
      properties:
        totalRows: { type: integer }
        imported: { type: integer }
        errors:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
          description: What the importer decided along the way (for example which attributes identified the students)

    PageResponse:
      type: object
      properties:
        content:
          type: array
          items: { type: object }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        first: { type: boolean }
        last: { type: boolean }

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string, example: VALIDATION_FAILED }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        details:
          type: array
          items: { type: string }

    AllocationDto:
      type: object
      properties:
        allocationId: { type: integer, format: int64 }
        rollNo: { type: string, nullable: true }
        identity:
          type: string
          nullable: true
          description: |
            The institution's identifier for this student — the roll number,
            the registration number, or the first part of a combined identity.
            `rollNo` keeps its old meaning; `identity` is what to show.
        name: { type: string }
        department: { type: string, nullable: true }
        yearSession: { type: string, nullable: true }
        subjectCode: { type: string, nullable: true }
        hallName: { type: string }
        benchRow: { type: integer }
        benchCol: { type: integer }
        slot: { type: integer }

    MoveAllocationRequest:
      type: object
      required: [roomId, benchRow, benchCol, slot]
      properties:
        roomId:
          type: integer
          format: int64
          description: Id of the hall the new seat belongs to.
        benchRow:
          type: integer
          minimum: 1
          description: 1-based bench row inside the hall grid.
        benchCol:
          type: integer
          minimum: 1
          description: 1-based bench column inside the hall grid.
        slot:
          type: integer
          minimum: 1
          maximum: 2
          description: Seat on the bench — 1 on a single-seater, 1 or 2 on a dual-seater.

    SeatingResponse:
      type: object
      properties:
        seated: { type: integer }
        unplaced: { type: integer }
        totalSlots: { type: integer }
        backtracks: { type: integer }
        solved: { type: boolean }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
        allocations:
          type: array
          items: { $ref: '#/components/schemas/AllocationDto' }

    ArrangeRequest:
      type: object
      properties:
        strictness:
          type: string
          enum: [BASIC, INTERMEDIATE, ADVANCED, NORMAL, EXTREME]
        horizontalGap: { type: integer, minimum: 0, maximum: 10 }
        verticalGap: { type: integer, minimum: 0, maximum: 10 }
        diagonalGap: { type: integer, minimum: 0, maximum: 10 }
        conflictScope:
          type: string
          enum: [DEPARTMENT, YEAR, DEPARTMENT_AND_YEAR, DEPARTMENT_OR_YEAR]
        benchPairingRule:
          type: string
          enum: [DIFFERENT_DEPARTMENT_AND_YEAR, DIFFERENT_DEPARTMENT_ONLY]
        horizontalDeptIsolation: { type: boolean }
        groupAttributes:
          type: array
          items:
            type: string
            enum: [DEPARTMENT, COURSE, YEAR_SESSION]
        groupMatchMode:
          type: string
          enum: [ALL, ANY]
        subjectCode: { type: string, nullable: true }
        roomIds:
          type: array
          nullable: true
          items: { type: integer, format: int64 }
        clearExisting: { type: boolean, default: true }

    RegisterRequest:
      type: object
      required: [institutionName, slug, adminUsername, adminPassword]
      properties:
        institutionName: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 60, example: springfield-college }
        adminUsername: { type: string, minLength: 3, maxLength: 50 }
        adminPassword: { type: string, format: password, minLength: 8, maxLength: 100 }
        adminEmail: { type: string, maxLength: 120 }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    UserView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [ADMIN, EXAM_CELL, INVIGILATOR] }
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }

    InstitutionView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        contactEmail: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }

    InstitutionUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        contactEmail: { type: string, maxLength: 120 }

    AuthSession:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserView' }
        institution: { $ref: '#/components/schemas/InstitutionView' }

    PlanView:
      type: object
      properties:
        code: { type: string, enum: [FREE, STARTER, PRO, ENTERPRISE] }
        name: { type: string }
        monthlyPrice: { type: number, format: double }
        maxStudents: { type: integer }
        maxRooms: { type: integer }
        maxGenerationsPerMonth: { type: integer }
        storageLimitMb: { type: integer, format: int64 }
        maxFileSizeMb: { type: integer, format: int64 }
        seatsPerGeneration: { type: integer }
        sortOrder: { type: integer }

    SubscriptionView:
      type: object
      properties:
        planCode: { type: string }
        planName: { type: string }
        status: { type: string, enum: [ACTIVE, PAST_DUE, CANCELLED] }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        plan: { $ref: '#/components/schemas/PlanView' }

    PlanChangeRequest:
      type: object
      required: [planCode]
      properties:
        planCode: { type: string, enum: [FREE, STARTER, PRO, ENTERPRISE] }

    UsageView:
      type: object
      properties:
        planCode: { type: string }
        planName: { type: string }
        studentsUsed: { type: integer, format: int64 }
        studentsLimit: { type: integer }
        roomsUsed: { type: integer, format: int64 }
        roomsLimit: { type: integer }
        generationsUsed: { type: integer, format: int64 }
        generationsLimit: { type: integer }
        storageUsedBytes: { type: integer, format: int64 }
        storageLimitBytes: { type: integer, format: int64 }
        seatsPerGeneration: { type: integer }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }

    StoredFileView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        originalName: { type: string }
        contentType: { type: string, nullable: true }
        sizeBytes: { type: integer, format: int64 }
        uploadedAt: { type: string, format: date-time }

    GenerationView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        subjectCode: { type: string, nullable: true }
        seats: { type: integer }
        planCode: { type: string }
        createdAt: { type: string, format: date-time }

security:
  - bearerAuth: []
  - basicAuth: []
